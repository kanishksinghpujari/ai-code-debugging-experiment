services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: linkforge
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/linkforge
      SPRING_DATASOURCE_USERNAME: linkforge
      SPRING_DATASOURCE_PASSWORD: linkforge
      APP_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
