spring:
  application:
    name: linkforge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linkforge}
    username: ${SPRING_DATASOURCE_USERNAME:linkforge}
    password: ${SPRING_DATASOURCE_PASSWORD:linkforge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
